__include__: [
  '../dataset/cancer_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

output_dir: ./output/rtdetrv2_r18vd_cancer_detection

# 早停机制参数
early_stopping_patience: 10  # 容忍5个epoch没有改善
early_stopping_min_delta: 0.001  # 最小改善阈值

PResNet:
  depth: 18
  freeze_at: -1 #2 #-1
  freeze_norm: False #True #False
  pretrained: True

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

RTDETRTransformerv2:
  num_layers: 3 #2 #3

epoches: 100

optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
      weight_decay: 0.0001
    - 
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.0

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# lr_scheduler:
#   type: MultiStepLR
#   milestones: [60, 120, 160]  # 调整学习率衰减点
#   gamma: 0.5

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 1000

train_dataloader: 
  dataset: 
    transforms:
      policy:
        epoch: 159
  collate_fn:
    scales: ~

# 添加显存优化设置
sync_bn: false  # 关闭同步BN以节省显存
amp: true       # 启用自动混合精度

