__include__: [
  '../dataset/sputum_aug_detection.yml',
  '../runtime.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

output_dir: ./output/rtdetrv2_r18vd_sputum_aug

early_stopping_patience: 10
early_stopping_min_delta: 0.001

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

RTDETRTransformerv2:
  num_layers: 3

epoches: 100

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
      weight_decay: 0.0001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.0
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 2000

RTDETRCriterionv2:
  class_weight_file: DATA/SputumCell/split_dataset_aug/analysis/class_balance_class_weights.json
  class_weight_key: weight
  class_weight_power: 1.0

