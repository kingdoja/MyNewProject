__include__: [
  '../dataset/cancer_detection.yml',  # 包含数据集配置和增强的数据增强策略（当前使用 split4_aug）
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

output_dir: ./output/rtdetrv2_r50vd_cancer_detection_split4_aug

# 早停机制参数
early_stopping_patience: 15  # 从10增加到15，给更多轮次机会改善
early_stopping_min_delta: 0.001  # 最小改善阈值

PResNet:
  depth: 50
  freeze_at: 1
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels: [512, 1024, 2048]
  hidden_dim: 256
  expansion: 1.0

RTDETRTransformerv2:
  num_layers: 6

epoches: 70

optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001  # 从0.00001提高到0.00005，提升特征提取训练效果
      weight_decay: 0.0001
    - 
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.0

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [60, 80, 90]  # 在60、80、90轮时衰减学习率，适配100轮训练
  gamma: 0.5  # 每次衰减50%

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 2000  # 增加warmup步数，让模型在数据增强变化下更稳定地学习

# train_dataloader配置已在cancer_detection.yml中完整定义，此处不需要重复配置

# 添加显存优化设置
sync_bn: false  # 关闭同步BN以节省显存
amp: true       # 启用自动混合精度

