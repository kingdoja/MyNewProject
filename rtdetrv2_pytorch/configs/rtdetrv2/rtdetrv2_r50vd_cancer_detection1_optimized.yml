__include__: [
  '../dataset/cancer_detection1.yml',  # 包含数据集配置和增强的数据增强策略
  '../runtime.yml',
  './include/dataloader.yml',
  './include/rtdetrv2_r50vd.yml',
  # 注意：不包含optimizer.yml，因为我们需要使用CosineAnnealingLR而不是MultiStepLR
  # 如果需要optimizer.yml中的其他配置，可以手动添加
]

output_dir: ./output/rtdetrv2_r50vd_cancer_detection_split_dataset_1224

# 早停机制参数
early_stopping_patience: 25  # 增加耐心值，给模型更多时间收敛
early_stopping_min_delta: 0.00005  # 进一步降低最小改善阈值

PResNet:
  depth: 50
  freeze_at: 0
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels: [512, 1024, 2048]
  hidden_dim: 256
  expansion: 1.0

RTDETRTransformerv2:
  num_layers: 6
  num_queries: 400  # 进一步降低到400（从450降到400，节省更多显存）
  num_denoising: 100  # 保持100

epoches: 120  # 增加训练轮数

# 从optimizer.yml中手动添加的配置（除了lr_scheduler）
use_amp: True
use_ema: True 
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000
clip_max_norm: 0.1

optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001  # backbone学习率，保持较低
      weight_decay: 0.0001
    - 
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.0

  lr: 0.0001  # 提高基础学习率，从0.00005提高到0.0001，加快收敛
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# 学习率调度器：使用余弦退火，更平滑的学习率变化
# 注意：由于配置合并机制，需要确保不包含MultiStepLR的参数（milestones和gamma）
lr_scheduler:
  type: CosineAnnealingLR
  T_max: 120  # 训练轮数
  eta_min: 0.000001  # 最小学习率

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 3000  # 增加warmup步数，从2000增至3000，更平滑的预热

# 添加显存优化设置
sync_bn: false  # 关闭同步BN以节省显存
amp: true       # 启用自动混合精度

# 显存优化：覆盖dataloader.yml中的batch_size设置
train_dataloader:
  total_batch_size: 8  # 进一步降低到4，避免OOM（dataloader.yml会覆盖cancer_detection1.yml的设置）
  collate_fn:
    scales: [576, 608, 640, 640, 640, 672, 704]  # 进一步减少多尺度范围

val_dataloader:
  total_batch_size: 8  # 验证批次大小也降低到4

# 优化损失函数权重，针对小目标检测和类别不平衡
RTDETRCriterionv2:
  weight_dict: 
    loss_vfl: 6  # 提高分类损失权重（从5到6），更关注难样本
    loss_bbox: 2.5  # 提高边界框损失权重（从2到2.5），更精确的定位
    loss_giou: 1.5  # 提高GIoU损失权重（从1到1.5），更好的重叠度
  losses: ['vfl', 'boxes', ]
  alpha: 0.3  # 提高Focal Loss的alpha参数（从0.25到0.3），更关注正样本
  gamma: 3.0  # 提高Focal Loss的gamma参数（从2.5到3.0），更关注难样本
  matcher:
    type: HungarianMatcher
    weight_dict: 
      cost_class: 3  # 提高分类成本权重（从2到3）
      cost_bbox: 5  # 保持边界框成本权重
      cost_giou: 3  # 提高GIoU成本权重（从2到3）
    alpha: 0.3  # 匹配器中的alpha参数
    gamma: 3.0  # 匹配器中的gamma参数

# 增加dropout以减少过拟合
Transformer:
  dropout: 0.15  # 适中的dropout率（从0.2降到0.15），平衡过拟合和欠拟合

# 后处理器设置
RTDETRPostProcessor:
  num_top_queries: 400  # 与num_queries保持一致

